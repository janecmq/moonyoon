<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moonyoon</title>
<meta name="description" content="something for little ears. coming soon.">
<link rel="icon" href="assets/moon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&amp;display=swap">
<style>
body{margin:0;background:#1d1b3f}
a{color:#dcef7f}a:hover{color:#ffffff}

/* keyframes */
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.9;transform:scale(1.15)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
@keyframes drift{from{transform:translateX(-12vw)}to{transform:translateX(12vw)}}

/* scene */
.scene{position:relative;overflow:hidden;min-height:100vh;min-height:100svh;box-sizing:border-box;color:#fff;font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 24px;--x:calc(100% - 60px);--y:44px;--r:160vmax}
.sky{position:absolute;inset:0;pointer-events:none}
.night{background:#1d1b3f}
.day{background:linear-gradient(180deg,#a9dbf2 0%,#cdeaf3 45%,#fde6c6 100%);clip-path:circle(0 at var(--x) var(--y));transition:clip-path 1.1s cubic-bezier(.7,0,.25,1)}
[data-mode=yoon] .day{clip-path:circle(var(--r) at var(--x) var(--y))}
.grain{position:absolute;inset:0;background-image:url(assets/grain.png);background-size:512px 512px}

.star{position:absolute;border-radius:9999px;background:#fbf7ef;animation:twinkle 4s ease-in-out infinite}
.d1{animation-delay:-.5s;animation-duration:3.6s}
.d2{animation-delay:-1.4s;animation-duration:4.8s}
.d3{animation-delay:-2.3s;animation-duration:5.4s}
.d4{animation-delay:-3.1s;animation-duration:4.2s}

.cloud{position:absolute;width:120px;height:36px;border-radius:36px;background:#fff;opacity:.85;animation:drift 18s ease-in-out infinite alternate}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:52px;height:52px;left:18px;top:-26px}
.cloud::after{width:40px;height:40px;left:58px;top:-18px}
.c2{transform:scale(.7);animation-duration:24s;animation-delay:-8s}
.c3{animation-duration:30s;animation-delay:-15s}

/* toggle */
.toggle{position:absolute;top:24px;right:24px;z-index:2;display:flex;gap:4px;padding:4px;border-radius:9999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transition:background .8s,box-shadow .8s}
.toggle button{position:relative;z-index:1;display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:50%;background:none;color:#cfc2f5;cursor:pointer;transition:color .5s}
.toggle button[aria-pressed=true]{color:#1d1b3f}
.toggle button:focus-visible{outline:2px solid #dcef7f;outline-offset:2px}
.toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.thumb{position:absolute;top:4px;left:4px;width:36px;height:36px;border-radius:50%;background:#dcef7f;box-shadow:0 0 14px rgba(220,239,127,.5);transition:transform .6s cubic-bezier(.65,0,.35,1),background .6s,box-shadow .6s}
[data-mode=yoon] .toggle{background:rgba(255,255,255,.45);box-shadow:inset 0 0 0 1px rgba(29,27,63,.12)}
[data-mode=yoon] .toggle button{color:#3d3a7a}
[data-mode=yoon] .toggle button[aria-pressed=true]{color:#1d1b3f}
[data-mode=yoon] .thumb{transform:translateX(40px);background:#ffd166;box-shadow:0 0 14px rgba(255,178,77,.6)}

/* content */
.content{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center;width:100%;max-width:560px}
.slot{position:relative;width:72px;height:72px;animation:rise 1.2s ease-out both}
.wheel{position:absolute;inset:0;transform-origin:50% 260px;transform:rotate(var(--turn,0deg));transition:transform 1.2s cubic-bezier(.65,0,.35,1)}
.body{position:absolute;left:0;width:72px;height:72px;transition:opacity .4s}
.body img{position:relative;display:block;width:72px;height:72px}
.bob{position:relative;display:block;animation:bob 6s ease-in-out 1.2s infinite}
.moon{top:0}
.moon img{filter:drop-shadow(0 0 8px rgba(220,239,127,.45))}
.sun{top:448px;transform:rotate(180deg);opacity:0}
.sun img{filter:drop-shadow(0 0 8px rgba(255,178,77,.5))}
.halo{position:absolute;inset:-28px;border-radius:50%;animation:pulse 4s ease-in-out 1.2s infinite}
.moon .halo{background:radial-gradient(circle,rgba(220,239,127,.38) 0%,rgba(220,239,127,.14) 40%,rgba(220,239,127,0) 70%)}
.sun .halo{background:radial-gradient(circle,rgba(255,209,102,.55) 0%,rgba(255,178,77,.2) 40%,rgba(255,178,77,0) 70%)}
[data-mode=yoon] .moon{opacity:0}
[data-mode=yoon] .sun{opacity:1}
[data-mode=yoon] .sun,[data-mode=moon] .moon{transition:opacity .5s .6s}

.word{margin:0;line-height:0;animation:rise 1.4s ease-out .3s both}
.wordmark{display:block;width:clamp(260px,56vw,520px);aspect-ratio:9840/1452;background:#fbf7ef;-webkit-mask:url(assets/wordmark.svg) center/contain no-repeat;mask:url(assets/wordmark.svg) center/contain no-repeat;transition:background-color .9s .2s}
.line{margin:0;font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:500;font-size:24px;line-height:32px;color:#cfc2f5;animation:rise 1.4s ease-out .9s both,glow 5s ease-in-out 2.3s infinite;transition:color .9s .2s}
.line span{color:#f7a978;transition:color .9s .2s}
.foot{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:12px;line-height:16px;letter-spacing:.02em;color:#b7b3d6;animation:rise 1.4s ease-out 1.4s both;transition:color .9s .2s}
[data-mode=yoon] .wordmark{background-color:#1d1b3f}
[data-mode=yoon] .line{color:#3d3a7a}
[data-mode=yoon] .line span{color:#d9603a}
[data-mode=yoon] .foot{color:#5a5880}

@media (max-width:480px){.toggle{top:16px;right:16px}.scene{--x:calc(100% - 52px);--y:36px}}
@media (prefers-reduced-motion:reduce){
  .star,.cloud,.slot,.bob,.halo,.word,.line,.foot{animation:none}
  .day,.wheel,.body,.thumb,.wordmark,.line,.line span,.foot,.toggle,.toggle button{transition:none}
}
</style>
</head>
<body>
<main class="scene" data-mode="moon">
<div class="sky night" aria-hidden="true">
  <div class="grain"></div>
  <div class="star d1" style="left:12%;top:20%;width:4px;height:4px"></div>
  <div class="star d2" style="left:38%;top:10%;width:6px;height:6px"></div>
  <div class="star d3" style="left:22%;top:78%;width:5px;height:5px"></div>
  <div class="star d4" style="left:82%;top:16%;width:5px;height:5px"></div>
  <div class="star d1" style="left:70%;top:84%;width:4px;height:4px"></div>
  <div class="star d3" style="left:90%;top:58%;width:6px;height:6px"></div>
  <div class="star d2" style="left:6%;top:52%;width:3px;height:3px"></div>
</div>
<div class="sky day" aria-hidden="true">
  <div class="grain" style="opacity:.6"></div>
  <div class="cloud" style="left:10%;top:18%"></div>
  <div class="cloud c2" style="left:68%;top:12%"></div>
  <div class="cloud c3" style="left:58%;top:76%"></div>
  <div class="cloud c2" style="left:6%;top:70%"></div>
</div>

<div class="toggle" role="group" aria-label="Choose moon or yoon">
  <span class="thumb" aria-hidden="true"></span>
  <button type="button" data-to="moon" aria-pressed="true" aria-label="moon" title="moon">
    <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
  </button>
  <button type="button" data-to="yoon" aria-pressed="false" aria-label="yoon" title="yoon">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
  </button>
</div>

<div class="content">
  <div class="slot" aria-hidden="true">
    <div class="wheel">
      <span class="body moon"><span class="bob"><span class="halo"></span><img src="assets/moon.svg" alt=""></span></span>
      <span class="body sun"><span class="bob"><span class="halo"></span><img src="assets/yoon.svg" alt=""></span></span>
    </div>
  </div>
  <h1 class="word"><span class="wordmark" role="img" aria-label="moonyoon"></span></h1>
  <p class="line">something for little ears. <span>coming soon.</span></p>
</div>

<footer class="foot">© 2026 moonyoon</footer>
</main>
<script>
(function () {
  var scene = document.querySelector('.scene');
  var wheel = document.querySelector('.wheel');
  var icon = document.querySelector('link[rel=icon]');
  var buttons = document.querySelectorAll('.toggle button');
  var turn = 0;

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var mode = btn.dataset.to;
      if (scene.dataset.mode === mode) return;

      // grow the daylight out of whichever button was pressed
      var s = scene.getBoundingClientRect();
      var b = btn.getBoundingClientRect();
      var x = b.left + b.width / 2 - s.left;
      var y = b.top + b.height / 2 - s.top;
      var r = Math.hypot(Math.max(x, s.width - x), Math.max(y, s.height - y));
      scene.style.setProperty('--x', x + 'px');
      scene.style.setProperty('--y', y + 'px');
      scene.style.setProperty('--r', r + 'px');

      turn += 180;
      wheel.style.setProperty('--turn', turn + 'deg');
      scene.dataset.mode = mode;
      buttons.forEach(function (o) { o.setAttribute('aria-pressed', String(o === btn)); });
      icon.href = 'assets/' + mode + '.svg';
    });
  });
})();
</script>
</body>
</html>
