<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moonyoon</title>
<meta name="description" content="something for little ears. coming soon.">
<link rel="icon" href="assets/moon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&amp;display=swap">
<style>
body{margin:0;background:#1d1b3f}
a{color:#dcef7f}a:hover{color:#ffffff}
.grain{background-image:url(assets/grain.png);background-size:512px 512px}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.9;transform:scale(1.15)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{opacity:.75}50%{opacity:1}}
.tw{animation:twinkle 4s ease-in-out infinite}
.d1{animation-delay:-.5s;animation-duration:3.6s}
.d2{animation-delay:-1.4s;animation-duration:4.8s}
.d3{animation-delay:-2.3s;animation-duration:5.4s}
.d4{animation-delay:-3.1s;animation-duration:4.2s}
@keyframes moonglow{0%,100%{filter:drop-shadow(0 0 6px rgba(220,239,127,.35)) drop-shadow(0 0 18px rgba(220,239,127,.15))}50%{filter:drop-shadow(0 0 12px rgba(220,239,127,.7)) drop-shadow(0 0 36px rgba(220,239,127,.35))}}
.mark{filter:drop-shadow(0 0 8px rgba(220,239,127,.45)) drop-shadow(0 0 24px rgba(220,239,127,.2));animation:rise 1.2s ease-out both,bob 6s ease-in-out 1.2s infinite,moonglow 4s ease-in-out 1.2s infinite}
.word{animation:rise 1.4s ease-out .3s both}
.line{animation:rise 1.4s ease-out .9s both,glow 5s ease-in-out 2.3s infinite}
.foot{animation:rise 1.4s ease-out 1.4s both}
@media (prefers-reduced-motion: reduce){.tw,.mark,.word,.line,.foot{animation:none}}
</style>
</head>
<body>
<main style="position: relative; overflow: hidden; min-height: 100vh; box-sizing: border-box; background: #1d1b3f; color: #ffffff; font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 64px 24px;">
<div class="grain" aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none;"></div>

<div class="tw d1" aria-hidden="true" style="position: absolute; left: 12%; top: 20%; width: 4px; height: 4px; border-radius: 9999px; background: #fbf7ef; opacity: 0.5;"></div>
<div class="tw d2" aria-hidden="true" style="position: absolute; left: 38%; top: 10%; width: 6px; height: 6px; border-radius: 9999px; background: #fbf7ef; opacity: 0.7;"></div>
<div class="tw d3" aria-hidden="true" style="position: absolute; left: 22%; top: 78%; width: 5px; height: 5px; border-radius: 9999px; background: #fbf7ef; opacity: 0.4;"></div>
<div class="tw d4" aria-hidden="true" style="position: absolute; left: 82%; top: 16%; width: 5px; height: 5px; border-radius: 9999px; background: #fbf7ef; opacity: 0.6;"></div>
<div class="tw d1" aria-hidden="true" style="position: absolute; left: 70%; top: 84%; width: 4px; height: 4px; border-radius: 9999px; background: #fbf7ef; opacity: 0.4;"></div>
<div class="tw d3" aria-hidden="true" style="position: absolute; left: 90%; top: 58%; width: 6px; height: 6px; border-radius: 9999px; background: #fbf7ef; opacity: 0.5;"></div>
<div class="tw d2" aria-hidden="true" style="position: absolute; left: 6%; top: 52%; width: 3px; height: 3px; border-radius: 9999px; background: #fbf7ef; opacity: 0.5;"></div>

<div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; width: 100%; max-width: 560px;">
<img class="mark" src="assets/moon.svg" alt="" style="width: 72px; height: 72px;">
<h1 class="word" style="margin: 0; line-height: 0;"><img src="assets/wordmark.svg" alt="moonyoon" style="display: block; width: clamp(260px, 56vw, 520px); height: auto;"></h1>
<p class="line" style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 500; font-size: 24px; line-height: 32px; color: #cfc2f5;">something for little ears. <span style="color: #f7a978;">coming soon.</span></p>

</div>

<footer class="foot" style="position: absolute; left: 0; right: 0; bottom: 24px; text-align: center; font-size: 12px; line-height: 16px; letter-spacing: 0.02em; color: #b7b3d6;">© 2026 moonyoon</footer>
</main>
</body>
</html>
