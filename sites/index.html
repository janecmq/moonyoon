<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moonyoon</title>
<meta name="description" content="something for little ears. coming soon.">
<link rel="icon" href="assets/moon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&amp;display=swap">
<style>
/* moonyoon design system tokens: Bedtime (default) and Daytime */
:root{
  --night-surface:#1d1b3f;--night-raised:#28264f;--night-line:#3a3868;--night-ink:#fbf7ef;--night-muted:#b7b3d6;
  --day-surface:#f3ecdf;--day-raised:#ffffff;--day-line:#e2d9c8;--day-ink:#17142a;--day-muted:#5f5a72;
  --on-fill:#17142a;--moonbeam:#dcef7f;--lilac:#cfc2f5;--tangerine:#f7a978;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
}
body{margin:0;background:var(--night-surface)}

@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.9;transform:scale(1.15)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
@keyframes wobble{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-6px)}}

/* scene */
.scene{position:relative;overflow:hidden;min-height:100vh;min-height:100svh;box-sizing:border-box;color:var(--night-ink);font-family:var(--sans);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 24px;--x:calc(100% - 60px);--y:44px;--r:160vmax}
.sky{position:absolute;inset:0;pointer-events:none}
.night{background:var(--night-surface)}
.day{background:var(--day-surface);clip-path:circle(0 at var(--x) var(--y));transition:clip-path 1.1s cubic-bezier(.7,0,.25,1)}
[data-mode=yoon] .day{clip-path:circle(var(--r) at var(--x) var(--y))}
.grain{position:absolute;inset:0;background-image:url(assets/grain.png);background-size:512px 512px}

.star{position:absolute;border-radius:9999px;background:var(--night-ink);animation:twinkle 4s ease-in-out infinite}
.d1{animation-delay:-.5s;animation-duration:3.6s}
.d2{animation-delay:-1.4s;animation-duration:4.8s}
.d3{animation-delay:-2.3s;animation-duration:5.4s}
.d4{animation-delay:-3.1s;animation-duration:4.2s}

.doodle{position:absolute;width:36px;height:36px;animation:wobble 6s ease-in-out infinite}

/* toggle */
.toggle{position:absolute;top:24px;right:24px;z-index:2;display:flex;gap:4px;padding:4px;border-radius:9999px;background:var(--night-raised);box-shadow:inset 0 0 0 1px var(--night-line);transition:background .8s,box-shadow .8s}
.toggle button{position:relative;z-index:1;display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:9999px;background:none;color:var(--night-muted);cursor:pointer;transition:color .5s}
.toggle button[aria-pressed=true]{color:var(--on-fill)}
.toggle button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--night-surface),0 0 0 6px var(--moonbeam)}
.toggle svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.thumb{position:absolute;top:4px;left:4px;width:44px;height:44px;border-radius:9999px;background:var(--moonbeam);transition:transform .6s cubic-bezier(.65,0,.35,1),background .6s}
[data-mode=yoon] .toggle{background:var(--day-raised);box-shadow:inset 0 0 0 1px var(--day-line)}
[data-mode=yoon] .toggle button{color:var(--day-muted)}
[data-mode=yoon] .toggle button[aria-pressed=true]{color:var(--on-fill)}
[data-mode=yoon] .toggle button:focus-visible{box-shadow:0 0 0 3px var(--day-surface),0 0 0 6px #2b2a5c}
[data-mode=yoon] .thumb{transform:translateX(48px);background:var(--lilac)}

/* content */
.content{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center;width:100%;max-width:560px}
.slot{position:relative;width:72px;height:72px;animation:rise 1.2s ease-out both}
.wheel{position:absolute;inset:0;transform-origin:50% 260px;transform:rotate(var(--turn,0deg));transition:transform 1.2s cubic-bezier(.65,0,.35,1)}
.body{position:absolute;left:0;width:72px;height:72px;transition:opacity .4s}
.body img{position:relative;display:block;width:72px;height:72px}
.bob{position:relative;display:block;animation:bob 6s ease-in-out 1.2s infinite}
.moon{top:0}
.moon img{filter:drop-shadow(0 0 8px rgba(220,239,127,.45))}
.yoon{top:448px;transform:rotate(180deg);opacity:0}
.yoon img{width:84px;height:84px;margin:-6px}
.halo{position:absolute;inset:-28px;border-radius:50%;background:radial-gradient(circle,rgba(220,239,127,.38) 0%,rgba(220,239,127,.14) 40%,rgba(220,239,127,0) 70%);animation:pulse 4s ease-in-out 1.2s infinite}
[data-mode=yoon] .moon{opacity:0}
[data-mode=yoon] .yoon{opacity:1}
[data-mode=yoon] .yoon,[data-mode=moon] .moon{transition:opacity .5s .6s}

.word{margin:0;line-height:0;animation:rise 1.4s ease-out .3s both}
.wordmark{display:block;width:clamp(262px,56.5vw,524px);aspect-ratio:9920/1532;background:var(--night-ink);-webkit-mask:url(assets/wordmark.svg?v=2) center/contain no-repeat;mask:url(assets/wordmark.svg?v=2) center/contain no-repeat;transition:background-color .9s .2s}
.line{margin:0;font-family:var(--display);font-style:italic;font-weight:500;font-size:24px;line-height:32px;color:var(--lilac);animation:rise 1.4s ease-out .9s both,glow 5s ease-in-out 2.3s infinite;transition:color .9s .2s}
.soon{position:relative;display:inline-block;isolation:isolate;color:var(--night-ink);transition:color .9s .2s}
.soon::before{content:"";position:absolute;z-index:-1;left:-4px;right:-4px;top:54%;height:25px;transform:translateY(-50%);background:url(assets/doodles/scribble.svg?v=2) center/100% 100% no-repeat;clip-path:inset(0 100% 0 0)}
.soon.draw::before{animation:draw .7s cubic-bezier(.65,0,.35,1) var(--draw-delay,0s) both}
[data-mode=moon] .soon::before{background-image:url(assets/doodles/scribble-night.svg?v=2)}
@keyframes draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.foot{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.02em;color:var(--night-muted);animation:rise 1.4s ease-out 1.4s both;transition:color .9s .2s}
[data-mode=yoon] .wordmark{background-color:var(--day-ink)}
[data-mode=yoon] .line,[data-mode=yoon] .soon{color:var(--day-ink)}
[data-mode=yoon] .foot{color:var(--day-muted)}

@media (max-width:480px){.toggle{top:16px;right:16px}.scene{--x:calc(100% - 66px);--y:42px}}
@media (prefers-reduced-motion:reduce){
  .star,.doodle,.slot,.bob,.halo,.word,.line,.foot{animation:none}
  .soon::before{clip-path:none!important;animation:none!important}
  .day,.wheel,.body,.thumb,.wordmark,.line,.soon,.foot,.toggle,.toggle button{transition:none!important}
}
</style>
</head>
<body>
<main class="scene" data-mode="moon">
<div class="sky night" aria-hidden="true">
  <div class="grain"></div>
  <div class="star d1" style="left:12%;top:20%;width:4px;height:4px"></div>
  <div class="star d2" style="left:38%;top:10%;width:6px;height:6px"></div>
  <div class="star d3" style="left:22%;top:78%;width:5px;height:5px"></div>
  <div class="star d4" style="left:82%;top:16%;width:5px;height:5px"></div>
  <div class="star d1" style="left:70%;top:84%;width:4px;height:4px"></div>
  <div class="star d3" style="left:90%;top:58%;width:6px;height:6px"></div>
  <div class="star d2" style="left:6%;top:52%;width:3px;height:3px"></div>
</div>
<div class="sky day" aria-hidden="true">
  <div class="grain"></div>
  <img class="doodle d1" src="assets/doodles/sparkle.svg?v=2" alt="" style="left:12%;top:18%">
  <img class="doodle d2" src="assets/doodles/heart.svg?v=2" alt="" style="left:80%;top:22%;width:30px;height:30px">
  <img class="doodle d3" src="assets/doodles/star.svg?v=2" alt="" style="left:18%;top:74%;width:30px;height:30px">
  <img class="doodle d4" src="assets/doodles/loop.svg?v=2" alt="" style="left:76%;top:76%;width:44px;height:44px">
  <img class="doodle d2" src="assets/doodles/sparkle.svg?v=2" alt="" style="left:88%;top:52%;width:24px;height:24px">
  <img class="doodle d3" src="assets/doodles/star.svg?v=2" alt="" style="left:6%;top:46%;width:22px;height:22px">
</div>

<div class="toggle" role="group" aria-label="Choose moon or yoon">
  <span class="thumb" aria-hidden="true"></span>
  <button type="button" data-to="moon" aria-pressed="true" aria-label="moon" title="moon">
    <svg viewBox="0 0 24 24"><path d="M19.5 15.2A8.2 8.2 0 1 1 9.6 3.8a6.6 6.6 0 0 0 9.9 11.4Z"/></svg>
  </button>
  <button type="button" data-to="yoon" aria-pressed="false" aria-label="yoon" title="yoon">
    <svg viewBox="0 0 24 24"><path d="M5.5 18h13a3 3 0 0 0 .4-6 5.6 5.6 0 0 0-10.8-1.6A3.9 3.9 0 0 0 5.5 18Z"/></svg>
  </button>
</div>

<div class="content">
  <div class="slot" aria-hidden="true">
    <div class="wheel">
      <span class="body moon"><span class="bob"><span class="halo"></span><img src="assets/moon.svg" alt=""></span></span>
      <span class="body yoon"><span class="bob"><img src="assets/yoon.svg" alt=""></span></span>
    </div>
  </div>
  <h1 class="word"><span class="wordmark" role="img" aria-label="moonyoon"></span></h1>
  <p class="line">something for little ears. <span class="soon draw" style="--draw-delay:1.9s">coming soon.</span></p>
</div>

<footer class="foot">© 2026 moonyoon</footer>
</main>
<script>
(function () {
  var scene = document.querySelector('.scene');
  var wheel = document.querySelector('.wheel');
  var soon = document.querySelector('.soon');
  var icon = document.querySelector('link[rel=icon]');
  var buttons = document.querySelectorAll('.toggle button');
  var turn = 0;

  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var mode = btn.dataset.to;
      if (scene.dataset.mode === mode) return;

      // grow the daylight out of whichever button was pressed
      var s = scene.getBoundingClientRect();
      var b = btn.getBoundingClientRect();
      var x = b.left + b.width / 2 - s.left;
      var y = b.top + b.height / 2 - s.top;
      var r = Math.hypot(Math.max(x, s.width - x), Math.max(y, s.height - y));
      scene.style.setProperty('--x', x + 'px');
      scene.style.setProperty('--y', y + 'px');
      scene.style.setProperty('--r', r + 'px');

      turn += 180;
      wheel.style.setProperty('--turn', turn + 'deg');
      scene.dataset.mode = mode;
      buttons.forEach(function (o) { o.setAttribute('aria-pressed', String(o === btn)); });
      icon.href = 'assets/' + mode + '.svg';

      // redraw the highlight once the new scene has settled
      soon.classList.remove('draw');
      soon.style.setProperty('--draw-delay', '.9s');
      void soon.offsetWidth;
      soon.classList.add('draw');
    });
  });
})();
</script>
</body>
</html>
